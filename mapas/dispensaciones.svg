<text x="1338.3" y="476" fill="#F4F1E8" font-size="13" text-anchor="middle" opacity="0.75">Ap 20</text>
<line x1="40" y1="550" x2="1440" y2="550" stroke="#B5893C" stroke-width="2"/>
<polygon points="1440,550 1422,544 1422,556" fill="#B5893C"/>
<text x="740.0" y="720" fill="#8a7a52" font-size="14" text-anchor="middle" font-style="italic">Esquema dispensacional. La división exacta de las dispensaciones varía entre autores.</text>
<text x="740.0" y="744" fill="#B5893C" font-size="13" text-anchor="middle">Escudriñad</text>
